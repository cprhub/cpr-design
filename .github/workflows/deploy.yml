name: Byg og udgiv siden

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Sæt Python op
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Installer afhængigheder
        run: pip install -r requirements.txt

      - name: Byg og udgiv med MkDocs
        run: mkdocs gh-deploy --force
