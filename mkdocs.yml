site_name: Coding Pirates Rødovre
site_description: Undervisningsmateriale til Coding Pirates Rødovres hold
site_url: https://cprhub.github.io/cpr-design/
repo_url: https://github.com/cprhub/cpr-design
repo_name: cpr-design
docs_dir: docs

theme:
  name: material
  language: da
  logo: assets/logo.png       # læg det officielle CP-logo her (se assets/README.md)
  favicon: assets/favicon.png
  palette:
    # Coding Pirates officielle farver
    # Primær blå:  #25A2CE
    # Primær gul:  #EFB422
    - scheme: default
      primary: custom
      accent: custom
  font: false                  # vi styrer fonte selv via extra.css (Bungee + Lato)
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: da
          default: true
          name: Dansk
          build: true
        - locale: en
          name: English
          build: true

nav:
  - Forside: index.md
  - Juletog:
      - Oversigt: juletog/index.md
      - Session 1 · Opsætning & Tinkercad: juletog/session-01-opsaetning/index.md
      - Session 2 · Lokomotivets grove form: juletog/session-02-lokomotiv-grov-form/index.md
  - Pinball:
      - Oversigt: pinball/index.md
      - Session 1 · Opsætning & Tinkercad: pinball/session-01/index.md
      - Session 2 · Designfasen: pinball/session-02/index.md
      - Session 3 · Flipperen: pinball/session-03/index.md
      - Session 4: pinball/session-04/index.md
      - Session 5: pinball/session-05/index.md
      - Session 6: pinball/session-06/index.md
      - Session 7: pinball/session-07/index.md
      - Session 8: pinball/session-08/index.md
      - Session 9: pinball/session-09/index.md
      - Session 10: pinball/session-10/index.md
      - Session 11: pinball/session-11/index.md
      - Session 12: pinball/session-12/index.md
      - Session 13: pinball/session-13/index.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - toc:
      permalink: true
